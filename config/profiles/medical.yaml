vertical: medical
description: >
  Медицина и здравоохранение для специалиста: клинические исследования, новые препараты и терапии,
  биотех и фарма, медтех и устройства, ИИ в медицине, эпидемиология и общественное здоровье,
  геномика, нейронауки, онкология, регуляции (FDA/EMA), прорывы в диагностике и лечении.
  Что реально происходит в мире медицины и куда движется отрасль.
  Не интересно: реклама БАДов, поп-биохакинг без доказательной базы, спорт.


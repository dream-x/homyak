vertical: it
description: >
  Программирование в широком смысле и инженерная практика: Python, Go, Java, Rust, C++ —
  без фаворитов. Системное и backend-программирование, распределённые системы, базы данных,
  Kubernetes/DevOps, сети, производительность, dev-tools и инфраструктура. AI/LLM: агенты,
  inference, локальный self-hosting, ML-research. Прикладной security. Заходят разборы
  архитектуры, инженерные посты, новые инструменты и релизы.
  Не интересно: крипта как спекуляция, политика, спорт, обзоры гаджетов, AI-хайп без сути.


vertical: business
description: >
  Рынки и экономика для трейдера и предпринимателя: макро, ставки ЦБ, инфляция, фондовый рынок,
  сырьё и валюты, настроение рынка (risk-on/risk-off), крупные сделки M&A, отчётности компаний,
  венчур и стартап-экономика, регуляции, геоэкономика — «куда катится мир» и что двигает деньги.
  Не интересно: спорт, светская хроника, сугубо технические IT-детали без бизнес-эффекта.


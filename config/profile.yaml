  - {name: ml-research, polarity: love}
  - {name: ai,          polarity: like}
  - {name: rust,        polarity: like}
  - {name: systems,     polarity: like}
  - {name: devtools,    polarity: like}
  - {name: startups,    polarity: like}
  - {name: security,    polarity: like}
  - {name: crypto,      polarity: mute}
  - {name: politics,    polarity: mute}

# Стартовый профиль интересов. Отредактируй под себя и применяй: `uv run homyak-profile-set`.
# polarity: love | like | meh | dislike | mute  (mute — жёсткий фильтр: тема не попадёт в ленту)

description: >
  AI-агенты и агентные фреймворки, LLM и inference/self-hosting, ML-research (arXiv cs.CL/LG),

# Трендовые темы под пристальное внимание. Матч по алиасам (RU+EN, регистронезависимо):
# короткие токены — по границе слова (\bopec\b), фразы — по вхождению. Правь свободно (volume-mount).
#
# boost: false — тему отслеживаем (панель на дашборде, 👁 в ленте, всегда проходит гейт),
# но НЕ поднимаем в ранжировании. Для «хочу видеть, но наверх не тащи».
watchlist:
  - name: ChatGPT
    aliases: [chatgpt, "chat gpt", "gpt-4", "gpt-5", "gpt4o", "gpt-4o"]
  - name: Claude
    aliases: [claude, anthropic, "claude opus", "claude sonnet"]
  - name: Iran
    aliases: [iran, iranian, tehran, иран, иранск, тегеран]
  - name: Trump
    aliases: [trump, "donald trump", трамп]
  - name: Нефть
    aliases: [oil, "crude oil", crude, brent, wti, opec, petroleum, нефть, нефт, опек, баррел, barrel]
  - name: Недоношенность
    aliases: [preterm, "premature birth", "premature infant", prematurity, neonatal, preemie,
              недоношен, "преждевременные роды", неонатал]
  - name: RUB/USD
    aliases: ["usd/rub", "rub/usd", "usd rub", ruble, rouble, рубль, рубл, "курс рубля", "ruble exchange"]
  - name: Рынок России
    aliases: [moex, "russian market", "russian stocks", "rts index", ммвб, мосбиржа,
              "рынок россии", "российский рынок", "российских акци", "российского рынка"]
  # Стихия: видеть отдельно хочу, а поднимать в ленте — нет (потому boost: false).
  # Осторожно с алиасами: «град» поймал бы «градус/градостроительный», «стихи» — стихотворения.
  - name: Природные явления
    boost: false
    aliases: [ураган, шторм, землетрясен, наводнен, паводок, паводк, засух, ливень, ливн,
              смерч, торнадо, тайфун, цунами, циклон, метел, снегопад, заморозк, оползен,
              стихийн, мчс, "лесные пожар", "лесной пожар", "аномальная жара",
              hurricane, earthquake, flood, storm, wildfire, tsunami, typhoon, drought,
              tornado, blizzard, heatwave, "heat wave", cyclone, landslide]

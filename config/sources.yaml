  - {name: simonwillison,  url: "https://simonwillison.net/atom/everything/",          category: ai,       interval_seconds: 3600, weight: 0.9}
  - {name: phoronix,       url: "https://www.phoronix.com/rss.php",                    category: tech,     interval_seconds: 1800, weight: 0.7}
  - {name: selfhst,        url: "https://selfh.st/rss/",                               category: tech,     interval_seconds: 3600, weight: 0.9}
  - {name: selfhst_weekly, url: "https://selfh.st/weekly/rss/",                        category: tech,     interval_seconds: 86400, weight: 1.0}


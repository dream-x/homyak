# Декларация источников. Секреты — не здесь: только имя env-переменной в token_env.

miniflux:
  enabled: false            # включи, когда поднят Miniflux и задан MINIFLUX_TOKEN в .env
  base_url: http://localhost:8080
  token_env: MINIFLUX_TOKEN
  interval_seconds: 300
  categories: [tech, ai]

rss:
  - {name: hn,             url: "https://news.ycombinator.com/rss",              category: tech,        interval_seconds: 600,  weight: 1.0}
  - {name: habr_best,      url: "https://habr.com/ru/rss/best/daily/",           category: tech,        interval_seconds: 3600, weight: 0.9}
  - {name: lobsters,       url: "https://lobste.rs/rss",                         category: tech,        interval_seconds: 900,  weight: 0.8}
  # arxiv_cs_cl / arxiv_cs_lg — временно убраны (слишком шумный поток препринтов)
  - {name: huggingface,    url: "https://huggingface.co/blog/feed.xml",          category: ai,          interval_seconds: 3600, weight: 0.9}
  - {name: paperswithcode, url: "https://paperswithcode.com/feeds/latest",       category: ai_research, interval_seconds: 3600, weight: 0.9}
  - {name: techcrunch,     url: "https://techcrunch.com/feed/",                  category: tech,        interval_seconds: 900,  weight: 0.7}
  - {name: the_verge,      url: "https://www.theverge.com/rss/index.xml",        category: tech,        interval_seconds: 900,  weight: 0.7}
  - {name: ars,            url: "https://feeds.arstechnica.com/arstechnica/index", category: tech,      interval_seconds: 1800, weight: 0.8}

  # --- business / рынки / экономика (вертикаль определяет теггер) ---
  - {name: wsj_markets,    url: "https://feeds.a.dj.com/rss/RSSMarketsMain.xml",       category: business, interval_seconds: 900,  weight: 0.9}
  - {name: wsj_business,   url: "https://feeds.a.dj.com/rss/WSJcomUSBusiness.xml",      category: business, interval_seconds: 1200, weight: 0.9}
  - {name: marketwatch,    url: "http://feeds.marketwatch.com/marketwatch/topstories/", category: business, interval_seconds: 900,  weight: 0.8}
  - {name: guardian_biz,   url: "https://www.theguardian.com/business/rss",            category: business, interval_seconds: 1200, weight: 0.7}
  - {name: investing_com,  url: "https://www.investing.com/rss/news.rss",              category: business, interval_seconds: 1200, weight: 0.7}

  # --- medical / здравоохранение / биотех / фарма ---
  - {name: statnews,       url: "https://www.statnews.com/feed/",                      category: medical,  interval_seconds: 1800, weight: 0.9}
  - {name: sciencedaily_health, url: "https://www.sciencedaily.com/rss/health_medicine.xml", category: medical, interval_seconds: 3600, weight: 0.8}
  - {name: medpage,        url: "https://www.medpagetoday.com/rss/headlines.xml",      category: medical,  interval_seconds: 1800, weight: 0.8}
  - {name: fiercebiotech,  url: "https://www.fiercebiotech.com/rss/xml",               category: medical,  interval_seconds: 3600, weight: 0.9}
  - {name: fiercepharma,   url: "https://www.fiercepharma.com/rss/xml",                category: medical,  interval_seconds: 3600, weight: 0.9}
  - {name: nature_medicine, url: "https://www.nature.com/nm.rss",                      category: medical,  interval_seconds: 7200, weight: 1.0}
  - {name: kff_health,     url: "https://kffhealthnews.org/feed/",                     category: medical,  interval_seconds: 3600, weight: 0.7}

  # --- business (доп.) ---
  - {name: economist_fin,  url: "https://www.economist.com/finance-and-economics/rss.xml", category: business, interval_seconds: 3600, weight: 1.0}
  - {name: bi_markets,     url: "https://markets.businessinsider.com/rss/news",        category: business, interval_seconds: 1200, weight: 0.7}
  - {name: fortune,        url: "https://fortune.com/feed/",                           category: business, interval_seconds: 1800, weight: 0.7}
  - {name: nyt_business,   url: "https://rss.nytimes.com/services/xml/rss/nyt/Business.xml", category: business, interval_seconds: 1200, weight: 0.8}
  - {name: nyt_economy,    url: "https://rss.nytimes.com/services/xml/rss/nyt/Economy.xml",  category: business, interval_seconds: 1800, weight: 0.8}
  - {name: seekingalpha,   url: "https://seekingalpha.com/feed.xml",                   category: business, interval_seconds: 1800, weight: 0.7}
  - {name: zerohedge,      url: "https://feeds.feedburner.com/zerohedge/feed",         category: business, interval_seconds: 1800, weight: 0.6}
  - {name: wolfstreet,     url: "https://wolfstreet.com/feed/",                        category: business, interval_seconds: 3600, weight: 0.7}

  # --- medical (доп.) ---
  - {name: lancet,         url: "https://www.thelancet.com/rssfeed/lancet_current.xml", category: medical, interval_seconds: 7200, weight: 1.0}

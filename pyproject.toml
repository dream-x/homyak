[project]
name = "homyak"
version = "0.1.0"
description = "Персональный агрегатор новостей под интересы (плагинная + event-driven архитектура)"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    # Phase 2
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "feedparser>=6.0",
    "nats-py>=2.9",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "feedgen>=1.0",
    # Phase 3
    "qdrant-client>=1.10",
    "sse-starlette>=2.0",
    "rich>=13.0",
    # Phase 6.1+
    "aiogram>=3.0",
    "trafilatura>=1.12",
    "aiohttp-socks>=0.11.0",
]

[project.scripts]
homyak-ingest-poll = "homyak.pipeline.ingest_poll:main"
homyak-processor = "homyak.pipeline.processor:main"
homyak-sweeper = "homyak.pipeline.sweeper:main"
homyak-api = "homyak.pipeline.serve:main"
homyak-tg-relay = "homyak.pipeline.tg_relay:main"
homyak-telegram-ingest = "homyak.pipeline.telegram_ingest:main"
homyak-reembed = "homyak.cli.reembed:main"
homyak-backfill-titles = "homyak.cli.backfill_titles:main"
homyak-resummarize = "homyak.cli.resummarize:main"
homyak-cli = "homyak.adapters.outputs.cli:main"
homyak-interests = "homyak.cli.interests:main"
homyak-tgbot = "homyak.adapters.outputs.tg_bot:main"
homyak-learner = "homyak.pipeline.learner:main"
homyak-wiki = "homyak.pipeline.wiki:main"
homyak-wiki-backfill = "homyak.cli.wiki_backfill:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homyak"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "faker>=25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

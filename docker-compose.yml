# Полный стек Homyak под Podman (podman compose) / Docker Compose.
# Ollama НЕ контейнеризуется — работает на хосте (Metal); контейнеры смотрят на host.containers.internal.
# Инфра: postgres, qdrant, nats. App: migrate + ingest-poll, telegram-ingest, processor, learner,
# sweeper, tgbot, api (один образ, разные команды).

x-app: &app
  build: .
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+asyncpg://homyak:homyak@postgres:5432/homyak
    NATS_URL: nats://nats:4222
    QDRANT_URL: http://qdrant:6333
    OLLAMA_URL: http://host.containers.internal:11434
  volumes:
    - ./config:/app/config:ro  # источники/профили — живьём, без пересборки
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: homyak
      POSTGRES_PASSWORD: homyak
      POSTGRES_DB: homyak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homyak"]
      interval: 5s
      timeout: 3s
      retries: 15

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  ingest-poll:
    <<: *app
    command: ["homyak-ingest-poll"]
    depends_on: &after_migrate
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
      qdrant:
        condition: service_started

  telegram-ingest:
    <<: *app
    command: ["homyak-telegram-ingest"]
    depends_on: *after_migrate

  processor:
    <<: *app
    command: ["homyak-processor"]
    depends_on: *after_migrate

  learner:
    <<: *app
    command: ["homyak-learner"]
    depends_on: *after_migrate

  sweeper:
    <<: *app
    command: ["homyak-sweeper"]
    depends_on: *after_migrate

  tgbot:
    <<: *app
    command: ["homyak-tgbot"]
    depends_on: *after_migrate

  api:
    <<: *app
    command: ["homyak-api"]
    ports:
      - "8000:8000"
    depends_on: *after_migrate

volumes:
  pgdata:
  qdrant_storage:
  nats_data:

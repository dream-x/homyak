services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: homyak
      POSTGRES_PASSWORD: homyak
      POSTGRES_DB: homyak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homyak"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   # На Mac Ollama использует Metal; блок deploy.resources (nvidia) не нужен.

volumes:
  pgdata:
  qdrant_storage:
  nats_data:
  # ollama_data:

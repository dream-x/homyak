# Полный стек Homyak под Podman (podman compose) / Docker Compose.
# Ollama НЕ контейнеризуется — работает на хосте (Metal); контейнеры смотрят на host.containers.internal.
# Инфра: postgres, qdrant, nats. App: migrate + ingest-poll, telegram-ingest, processor, learner,
# sweeper, tgbot, api (один образ, разные команды).

x-app: &app
  build: .
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+asyncpg://homyak:homyak@postgres:5432/homyak
    NATS_URL: nats://nats:4222
    QDRANT_URL: http://qdrant:6333
    # Основной — 5090-бокс (white, storage-apps LAN); запасной — локальная Ollama на Metal.
    # У хостов РАЗНЫЕ модели: на боксе qwen3.6:27b, на Mac qwen3.5:9b (см. core/ollama.py).
    OLLAMA_URL: ${OLLAMA_URL:-http://192.168.100.235:11434}
    OLLAMA_URL_FALLBACK: ${OLLAMA_URL_FALLBACK:-http://host.containers.internal:11434}
    LLM_MODEL: ${LLM_MODEL:-qwen3.6:27b}
    LLM_MODEL_FALLBACK: ${LLM_MODEL_FALLBACK:-qwen3.5:9b}
    SUMMARY_MODEL: ${SUMMARY_MODEL:-qwen3.6:27b}
    # Локальное время: тихие часы бота (quiet_hours) и логи — в твоей таймзоне, а не UTC.
    TZ: ${TZ:-Europe/Moscow}
  volumes:
    - ./config:/app/config:ro  # источники/профили — живьём, без пересборки
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped  # инфра без политики не переживала рестарт docker-демона/ребут
    environment:
      POSTGRES_USER: homyak
      POSTGRES_PASSWORD: homyak
      POSTGRES_DB: homyak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homyak"]
      interval: 5s
      timeout: 3s
      retries: 15

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  # RSS-мост для Twitter/X: аккаунты доступны как RSS на http://rsshub:1200/twitter/user/<handle>
  # Нужен TWITTER_AUTH_TOKEN (auth_token cookie из твоего X-аккаунта) в .env.
  rsshub:
    image: diygod/rsshub:latest
    ports:
      - "1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  ingest-poll:
    <<: *app
    command: ["homyak-ingest-poll"]
    depends_on: &after_migrate
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
      qdrant:
        condition: service_started

  telegram-ingest:
    <<: *app
    command: ["homyak-telegram-ingest"]
    depends_on: *after_migrate

  processor:
    <<: *app
    command: ["homyak-processor"]
    depends_on: *after_migrate

  learner:
    <<: *app
    command: ["homyak-learner"]
    depends_on: *after_migrate

  sweeper:
    <<: *app
    command: ["homyak-sweeper"]
    depends_on: *after_migrate

  tgbot:
    <<: *app
    command: ["homyak-tgbot"]
    depends_on: *after_migrate

  api:
    <<: *app
    command: ["homyak-api"]
    ports:
      - "8000:8000"
    depends_on: *after_migrate

volumes:
  pgdata:
  qdrant_storage:
  nats_data:
